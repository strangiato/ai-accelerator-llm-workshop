{{- range $i := until (int .Values.numberOfUsers) }}
{{- $userNum := add $i 1 }}
{{- $userName := printf "user%d" $userNum }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $userName }}-admin
  namespace: {{ $userName }}-model-server
  labels:
    app.kubernetes.io/name: user-configs
    app.kubernetes.io/instance: {{ $userName }}
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
    app.kubernetes.io/part-of: {{ $.Chart.Name }}
subjects:
  - kind: User
    apiGroup: rbac.authorization.k8s.io
    name: {{ $userName }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
{{- end }}
